name: Build & Push Backend (Docker Hub)

on:
  push:
    branches: [ "main", "master" ]   # publica solo al hacer push a main/master
  pull_request:
    branches: [ "main", "master" ]   # en PR: build sin publicar
  workflow_dispatch:                 # botón "Run workflow"

permissions:
  contents: read
  packages: read

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (PR) / Build+Push (push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/thecrooks-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/thecrooks-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
