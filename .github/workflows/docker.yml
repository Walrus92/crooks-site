name: Build & Push (Matrix)

on:
  push:
    branches: [ "main", "master" ]   # publica SOLO en push
  workflow_dispatch:                  # botón manual (también publica)

permissions:
  contents: read
  packages: read

concurrency:
  group: docker-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: backend
            dockerfile: backend/Dockerfile
            imagename: thecrooks-backend

          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            imagename: thecrooks-frontend

          - service: admin
            context: frontend/admin-panel
            dockerfile: frontend/admin-panel/Dockerfile
            imagename: thecrooks-admin

    steps:
      - uses: actions/checkout@v4

      # DEBUG: lista el repo y las rutas críticas (verás esto en los logs)
      - name: List repo layout
        run: |
          pwd
          ls -la
          echo "---- backend ----"
          ls -la backend || true
          echo "---- frontend ----"
          ls -la frontend || true
          echo "---- admin-panel ----"
          ls -la frontend/admin-panel || true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta (latest + sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.imagename }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
